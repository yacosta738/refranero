[package]
name = "refranero-cli"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "Offline-first command-line proverbs with optional Cervantes and Wayback imports"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yacosta738/refranero"
homepage = "https://github.com/yacosta738/refranero"
keywords = ["proverbs", "cli", "refranero", "spanish"]
categories = ["command-line-utilities"]

[[bin]]
name = "refranero"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
owo-colors = "4.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
textwrap = "0.16"
url = "2.5"
webbrowser = "1.0"

[dev-dependencies]
insta = "1.49"

[lints.rust]
# Treat unsafe code as a lint violation
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow lints that are noisy in this codebase
doc_markdown = "allow"
unnested_or_patterns = "allow"
unnecessary_struct_initialization = "allow"
redundant_closure_for_method_calls = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
