[package]
name = "refranero-cli"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "Offline-first command-line proverbs with optional Cervantes and Wayback imports"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yacosta738/refranero"
homepage = "https://github.com/yacosta738/refranero"
keywords = ["proverbs", "cli", "refranero", "spanish"]
categories = ["command-line-utilities"]

[[bin]]
name = "refranero"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
webbrowser = "1.0"
