[package]
name = "refranero-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Offline-first command-line proverbs with optional Cervantes and Wayback imports"
license = "MIT"
readme = "README.md"
keywords = ["proverbs", "cli", "refranero", "spanish"]
categories = ["command-line-utilities"]

[[bin]]
name = "refranero"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
webbrowser = "1.0"
