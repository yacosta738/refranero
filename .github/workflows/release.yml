name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach assets for; this recovery mode skips registry publishing.
        required: false
        type: string
      version:
        description: SemVer version for release_tag; defaults to the tag without a leading v.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          fork: false

  release-context:
    name: Resolve release context
    needs: [release-please]
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      publish_registries: ${{ steps.context.outputs.publish_registries }}
    steps:
      - name: Resolve tag and version
        id: context
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_TAG" ]]; then
            tag="$MANUAL_TAG"
            version="$MANUAL_VERSION"
            if [[ -z "$version" ]]; then
              version="${tag#v}"
            fi
            registries=false
          elif [[ "$RELEASE_CREATED" == "true" ]]; then
            tag="$RELEASE_TAG"
            version="$RELEASE_VERSION"
            registries=true
          else
            echo "No release was created and no recovery tag was provided." >&2
            exit 1
          fi
          if [[ "$tag" == *$'\n'* || "$tag" == *$'\r'* || "$version" == *$'\n'* || "$version" == *$'\r'* ]]; then
            echo "Tag and version must not contain newlines." >&2
            exit 1
          fi
          if [[ -z "$tag" || -z "$version" ]]; then
            echo "A release tag and version are required." >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish_registries=$registries"
          } >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build release assets (${{ matrix.target }})
    needs: [release-context]
    if: ${{ needs.release-context.outputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Build native target
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare release tarball
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: node scripts/prepare-release-tarball.mjs "$RELEASE_TARGET" "target/$RELEASE_TARGET/release/refranero" "$RELEASE_VERSION" release-dist
      - name: Upload native binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/refranero
          if-no-files-found: error
          retention-days: 7
      - name: Upload release tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-${{ matrix.target }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: Publish release assets
    needs: [release-context, build-release-assets]
    if: ${{ !cancelled() && needs.release-context.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
    steps:
      # Mint a scoped token in this job; the release-please job token is not shared.
      # Reuses APP_CLIENT_ID and APP_PRIVATE_KEY already required by release-please.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Download release tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          cd release-assets
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            asset="refranero-${RELEASE_VERSION}-${target}.tar.gz"
            for file in "$asset" "${asset}.sha256"; do
              if [[ ! -f "$file" ]]; then
                echo "Missing release asset: $file" >&2
                exit 1
              fi
            done
            entries=$(tar -tzf "$asset")
            if [[ "$entries" != "refranero" ]]; then
              echo "Unexpected archive contents in $asset: $entries" >&2
              exit 1
            fi
          done
          shopt -s nullglob
          tarballs=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          [[ ${#tarballs[@]} -eq 4 ]] || { echo "Expected 4 tarballs, found ${#tarballs[@]}" >&2; exit 1; }
          [[ ${#checksums[@]} -eq 4 ]] || { echo "Expected 4 checksum files, found ${#checksums[@]}" >&2; exit 1; }
          sha256sum -c -- *.sha256
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-crates:
    name: Publish to crates.io
    needs: [release-context, publish-release-assets]
    if: ${{ needs.release-context.outputs.publish_registries == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Publish refranero-cli
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish npm packages
    needs: [release-context, publish-release-assets]
    if: ${{ needs.release-context.outputs.publish_registries == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            package: linux-x64
            prebuilt: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            package: linux-arm64
            prebuilt: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            package: darwin-x64
            prebuilt: true
          - target: aarch64-apple-darwin
            os: macos-latest
            package: darwin-arm64
            prebuilt: true
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            package: win32-x64
            prebuilt: false
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            package: win32-arm64
            prebuilt: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: ${{ matrix.prebuilt != true }}
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Build native target
        if: ${{ matrix.prebuilt != true }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Download native binary
        if: ${{ matrix.prebuilt == true }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Prepare platform package (Unix)
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: node scripts/prepare-npm.mjs "$RELEASE_TARGET" "target/$RELEASE_TARGET/release/refranero" "$RELEASE_VERSION"
      - name: Prepare platform package (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: node scripts/prepare-npm.mjs "$env:RELEASE_TARGET" "target/$env:RELEASE_TARGET/release/refranero.exe" "$env:RELEASE_VERSION"
      - name: Publish platform package
        run: npm publish --provenance --access public
        working-directory: npm/dist/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-wrapper:
    name: Publish npm wrapper
    needs: [release-context, publish-npm]
    if: ${{ needs.release-context.outputs.publish_registries == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish wrapper package
        run: npm publish --provenance --access public
        working-directory: npm/wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Publish Docker image
    needs: [release-context, publish-release-assets]
    if: ${{ needs.release-context.outputs.publish_registries == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-context.outputs.tag }}
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if this is the newest release
        id: latest_check
        env:
          CURRENT_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          current="$CURRENT_VERSION"
          # A prerelease must never own the 'latest' tag.
          case "$current" in
            *-*)
              echo "is_latest=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping 'latest' tag: $current is a prerelease."
              exit 0
              ;;
          esac
          # Only stable tags count as "latest". Prereleases such as v1.0.0-rc.1
          # must never outrank a stable release, so they are filtered out
          # before comparing versions.
          newest=$(
            git tag --list 'v[0-9]*' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )
          if [ -z "$newest" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping 'latest' tag: no stable version tag found."
          elif [ "$(printf '%s\n%s\n' "$newest" "$current" | sort -V | tail -n1)" = "$current" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping 'latest' tag: $current is older than the newest stable version ($newest)."
          fi
      - name: Build and push (version tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            yacosta738/refranero:${{ needs.release-context.outputs.version }}
            ghcr.io/yacosta738/refranero:${{ needs.release-context.outputs.version }}
      - name: Build and push (latest tag)
        if: steps.latest_check.outputs.is_latest == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            yacosta738/refranero:latest
            ghcr.io/yacosta738/refranero:latest
