name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # NOTE: using GITHUB_TOKEN instead of a GitHub App installation token.
      # Trade-off: PRs/pushes made with GITHUB_TOKEN do not trigger other
      # workflow runs (GitHub restriction). The release PR opened below will
      # need its required status checks triggered manually (re-run, or an
      # empty commit) before it can satisfy the `main` ruleset and be merged.
      # Requirement: creating the release pull request with GITHUB_TOKEN also
      # needs "Allow GitHub Actions to create and approve pull requests"
      # enabled in repository (or organization) Settings > Actions > General.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          fork: false

  publish-crates:
    name: Publish to crates.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Publish refranero-cli
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish npm packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            package: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            package: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            package: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            package: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            package: win32-x64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            package: win32-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Build native target
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare platform package (Unix)
        if: runner.os != 'Windows'
        run: node scripts/prepare-npm.mjs ${{ matrix.target }} target/${{ matrix.target }}/release/refranero ${{ needs.release-please.outputs.version }}
      - name: Prepare platform package (Windows)
        if: runner.os == 'Windows'
        run: node scripts/prepare-npm.mjs ${{ matrix.target }} target/${{ matrix.target }}/release/refranero.exe ${{ needs.release-please.outputs.version }}
      - name: Publish platform package
        run: npm publish --access public
        working-directory: npm/dist/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-wrapper:
    name: Publish npm wrapper
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish wrapper package
        run: npm publish --access public
        working-directory: npm/wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Publish Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if this is the newest release
        id: latest_check
        run: |
          current="${{ needs.release-please.outputs.version }}"
          # A prerelease must never own the 'latest' tag.
          case "$current" in
            *-*)
              echo "is_latest=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping 'latest' tag: $current is a prerelease."
              exit 0
              ;;
          esac
          # Only stable tags count as "latest". Prereleases such as v1.0.0-rc.1
          # must never outrank a stable release, so they are filtered out
          # before comparing versions.
          newest=$(
            git tag --list 'v[0-9]*' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )
          if [ -z "$newest" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping 'latest' tag: no stable version tag found."
          elif [ "$(printf '%s\n%s\n' "$newest" "$current" | sort -V | tail -n1)" = "$current" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping 'latest' tag: $current is older than the newest stable version ($newest)."
          fi
      - name: Build and push (version tags)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yacosta738/refranero:${{ needs.release-please.outputs.version }}
            ghcr.io/yacosta738/refranero:${{ needs.release-please.outputs.version }}
      - name: Build and push (latest tag)
        if: steps.latest_check.outputs.is_latest == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            yacosta738/refranero:latest
            ghcr.io/yacosta738/refranero:latest
